<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLAES File Request Sheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }

        .page {
            width: 210mm;
            height: 297mm;
            padding: 2mm 10mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .sheet {
            height: 148.5mm;
            padding-bottom: 2mm;
            padding-top: 2mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 5px;
        }

        td {
            border: 1px solid black;
            padding: 2px 8px;
            font-size: 10px;
            height: 14px;
        }

        .label {
            width: 30%;
            font-weight: bold;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-bottom: 2px;
        }

        .sig-box {
            width: 40%;
            text-align: center;
        }

        .sig-line {
            border-top: 1px solid #1a73e8;
            margin-top: 15px;
            margin-bottom: 2px;
        }

        .sig-text {
            font-size: 9px;
            line-height: 1.1;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 1px;
        }

        @media print {
            body {
                background: none;
            }

            .page {
                margin: 0;
                box-shadow: none;
            }

            .print-btn {
                display: none;
            }
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>

<body>

    <button class="print-btn" onclick="window.print()">Print</button>

    <div class="page">
        <!-- SINGLE HALF-PAGE SHEET -->
        <div class="sheet">
            <div class="header">KLAES FILE REQUEST SHEET</div>

            <table>
                <tr>
                    <td class="label">File Number</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">File Title</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">File Request Priority</td>
                    <td>High / Medium / Low</td>
                </tr>
                <tr>
                    <td class="label">Registry (Origin)</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">Destination Office (Department)</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">Receiving Office</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">Receiving Officer</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label">Officer's Rank</td>
                    <td></td>
                </tr>
                <tr>
                    <td class="label" style="height: 40px; vertical-align: top;">Remark(s)</td>
                    <td></td>
                </tr>
            </table>

            <div class="signatures">
                <div class="sig-box">
                    <div class="sig-line"></div>
                    <div class="sig-text">
                        Signature and Date<br>
                        <strong>Requester</strong>
                    </div>
                </div>
                <div class="sig-box">
                    <div class="sig-line"></div>
                    <div class="sig-text">
                        Signature and Date<br>
                        <strong>Director Lands</strong>
                    </div>
                </div>
            </div>

            <div class="footer">
                <img src="http://app.klaes.ng/storage/upload/logo/logo.png" alt="KLAES Logo" style="height: 25px;">
            </div>
        </div>
    </div>

</body>

</html>
