## How The Upload Flow Works

### **1. Upload Phase**
User uploads CSV → Browser sends to FastAPI endpoint → File buffered into `io.BytesIO`

### **2. Parse Phase**
Pandas reads CSV → Field mapping applied → `process_file_indexing_data()` normalizes columns

### **3. QC Phase**
- **File number validation** (`_run_qc_validation()`)
  - Checks padding (leading zeros)
  - Checks year format (2-digit vs 4-digit)
  - Checks spacing issues
- **Date validation** (coerces malformed dates)
- **Required field checks** (flags missing data)
- **Duplicate detection** (identifies duplicate records)

### **4. Property ID Assignment**
- Lookup existing property IDs in database
- Reuse if found (same file number)
- Generate new IDs for new properties
- Cache prevents duplicate generation in same session

### **5. Preview Phase**
UI renders:
- ✅ Valid records (ready to import)
- ⚠️ Issues (with suggestion fixes)
- 🔄 Duplicates (highlighted for review)

### **6. Edit Phase**
User can:
- Inline edit cells (JS sends updates)
- Auto-fix flagged records (uses `suggested_fix`)
- Delete problem rows
- Re-run QC validation

### **7. Import Phase**
Validated records → SQLAlchemy models → Database commit
- Updates `FileIndexing` table
- Creates/updates `CofO` (Certificate of Occupancy) records
- Syncs `PropID_Master` for property tracking
- Updates `Grouping` table for file organization

---

## Key Design Patterns

### **Session-Based Upload Management**
- Each upload gets a `session_id` (UUID)
- In-memory buffer in `app.sessions[session_id]` stores:
  ```python
  {
    'property_records': [...],    # Main records
    'cofo_records': [...],         # CofO staging
    'qc_issues': {...},            # Validation issues
    'duplicates': {...},           # Duplicate summary
  }
  ```
- Sessions cleared after import to prevent memory leaks

### **Field Normalization**
Services provide single-point helpers:
- `_normalize_string()` - trim & clean text
- `_normalize_cofo_date()` - parse flexible date formats
- `_normalize_registry()` - extract registry numbers
- `_standardize_file_number()` - uppercase & remove suffixes

### **Database Pattern**
Uses SQLAlchemy for type-safe queries with fallback handling:
```python
# If SQL Server unavailable, retry with SQLite
def get_database_url():
    try:
        return os.getenv('DATABASE_URL')  # SQL Server
    except:
        return 'sqlite:///file_indexing.db'  # Fallback
```

### **Frontend-Backend Sync**
- JS controllers mirror server logic for UX (no full refresh)
- Responses use standard payload shape so UI renderers reuse code
- Table updates via optimistic updates + server validation

---

## Database Models

**Key Tables:**
- `FileIndexing` - Main property records
- `CofO` - Certificate of Occupancy staging
- `FileNumber` - MLS file number registry
- `Grouping` - File organization & batch tracking
- `PropID_Master` - Property ID → file number mapping
- `FileIndexing_QC` - QC validation history
- `EntityStaging` / `CustomerStaging` - Customer data

