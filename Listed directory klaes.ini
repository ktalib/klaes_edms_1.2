- **Behavior** — Auto-correct toggle, dry-run mode, backup settings
- **Correction rules** — Conflict handling, depth limits, whitelist/blacklist
- **Performance** — Check intervals, parallel renames, real-time watch toggle
- **Logging** — Level, format, retention

