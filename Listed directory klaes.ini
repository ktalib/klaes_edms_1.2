## Real-World Use Case

A land registry officer has **500 property records** from an external system:
1. Uploads CSV → App parses & finds 50 file number formatting issues
2. App suggests fixes (e.g., `KN-15-001` → `KN-2015-001`)
3. Officer reviews & auto-fixes where confident
4. App detects 8 duplicate records (same property, multiple rows)
5. Officer reviews & deletes duplicates
6. App assigns property IDs (reuses existing, creates new)
7. Officer clicks Import → Records saved to database
8. File history automatically updated for audit trail

**Result:** Clean, validated data in seconds instead of manual hours.

This is a **production-grade data pipeline** with quality gates, not just a simple file uploader.