- ❌ Error-prone (human mistakes)
- ❌ Hard to audit (no change tracking)

This system **automates it completely** while maintaining a full audit trail.



 

## Folder Search EDMS - Project Overview

This is an **Electronic Document Management System (EDMS)** built to search through folder hierarchies on network shares. Think of it as a smart folder finder for organizations managing large document repositories.

### **What Does It Do?**
The app lets users quickly search for folders on a network drive (in this case, a land registry data share at `\\10.50.1.1\land_registry_raw`). Users type in a folder name or partial name, and the system:
- Searches through pre-indexed directories
- Ranks results using intelligent scoring
- Displays matching folders with their full paths and metadata (size, modification time, depth)
- Lets users browse folder contents and preview files

### **Technical Stack**

**Backend:**
- **FastAPI** - Modern Python web framework for REST APIs
- **SQLite** - Lightweight database storing folder metadata (name, path, size, modification time, directory depth)
- **Threading** - Background indexing to avoid blocking the web server
- **PIL + PyPDF2** - Image processing and PDF manipulation (for watermarking documents)

**Frontend:**
- **HTML/CSS/JavaScript** - Interactive single-page app
- **Lucide icons** - Modern icon library
- **Fetch API** - Communicates with backend endpoints

### **How It Works**

1. **Indexing Phase** (on startup):
   - `Indexer` recursively walks the UNC network share (`os.walk()`)
   - Extracts folder metadata: name, full path, parent, depth, modification time, size
   - Stores everything in SQLite database for fast lookups
   - Runs in background so the app stays responsive

2. **Search Phase** (when user types):
   - Frontend calls `/api/search` with user's query
   - `AISearchEngine.search()` finds substring matches in the SQLite DB
   - Ranks results using heuristics: exact match boost, path match boost, token prefix matching
   - Returns top results with display paths (cleaned UNC prefixes)

3. **Security**:
   - **Path traversal protection**: All file paths validated through `_safe_resolve()` to prevent escaping the UNC share
   - **Mobile blocking**: Middleware rejects mobile device access
   - **Audit logging**: Planned SQL Server integration to log document access with user/IP/timestamp
   - **Access gates**: Secondary password validation via bcrypt before document viewing

### **Key Files**

| File | Purpose |
|------|---------|
| app.py | FastAPI server, endpoints, middleware, file serving |
| storage.py | SQLite schema & queries (folders table) |
| indexer.py | Folder crawling & batch database inserts |
| ai_search.py | Search ranking algorithm |
| models.py | Data structures, path formatting |
| app.js | Frontend search UI, folder browser, preview modal |
| config.py | Environment variables, database paths, SQL Server creds |

### **Data Flow**

```
Network Share (\\10.50.1.1\land_registry_raw)
    ↓
Indexer.load_or_build_index() [background thread]
    ↓
SQLite DB (~/ai_folder_search_data/folders.db)
    ↓
User types query in browser
    ↓
Frontend POST /api/search
    ↓
AISearchEngine.search() + storage.search_folders_substring()
    ↓
Results ranked & formatted
    ↓
JSON response → Browser displays results
```

### **Running It**
- **Start**: `python app.py` or start.bat → Serves on port 7000
- **Reindex**: `/api/reindex` endpoint triggers background folder crawl
- **Data location**: SQLite lives at ai_folder_search_data

This is a specialized tool for quickly navigating massive network document repositories—much faster than manual Windows Explorer browsing.







# CSV Importer Project Overview

This is a **comprehensive property and file management import system** built as a web application. Here's what it does and how it works:

## What the App Does

The CSV Importer is a **data ingestion and validation platform** for managing property records in Kano State, Nigeria. It allows users to:

1. **Upload and process multiple CSV/Excel files** containing property data
2. **Validate data quality** (QC checks for file numbers, dates, required fields)
3. **Match properties** with existing records in the database
4. **Manage file history** and property certificates
5. **Index properties** with property IDs and grouping information
6. **Handle complex staging workflows** for entities and customers
7. **Convert Excel files** to standardized CSV formats
8. **Track file lineage** through batch imports

## Key Features

✅ **PRA Import** - Property record import with validation  
✅ **File History Import** - Manage property history records  
✅ **File Indexing** - Index properties with IDs and metadata  
✅ **File Number Management** - QC and normalization of file numbering  
✅ **Duplicate Detection** - Identify and handle duplicate records  
✅ **Excel Conversion** - Convert proprietary formats to CSV  
✅ **Property Index Card** - Visual property detail cards  
✅ **Staging Management** - Customer and entity staging workflows  

---

## Technical Architecture

### **Backend Stack**
- **Framework**: FastAPI (Python web framework)
- **Async**: Built for high-performance async I/O
- **Database**: SQL Server (primary) or SQLite (local development)
- **ORM**: SQLAlchemy (database abstraction)
- **Data Processing**: Pandas (CSV/Excel manipulation)

### **Frontend Stack**
- **Templates**: Jinja2 (server-side templating)
- **CSS**: Bootstrap 5 + custom utilities
- **JavaScript**: Vanilla JS (no frameworks) with organized modules
- **Features**: Inline editing, drag-drop uploads, real-time validation

