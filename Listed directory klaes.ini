### **Key Components Breakdown**

**1. Watcher (watcher.py)**
- Monitors multiple directory paths simultaneously
- Uses Watchdog to detect folder creation/modification events
- Supports both **batch mode** (one-time fix) and **watch mode** (continuous)
- Debounces rapid changes to avoid duplicate processing
- Handles conflicts when folders already exist

**2. Validator (file_number_validator.py)**
- Parses folder names to extract file number components
- Validates against 720 known file number types across 3 catalogs (1981-2025)
- Applies 10+ normalization rules:
  - Uppercase conversion
  - OCR error fixes (`C0N` → `CON`)
  - Spelling corrections
  - Delimiter normalization (`/`, `_`, `.` → `-`)
  - Year format expansion (`'25` → `2025`)
- Returns corrected format or error description

**3. Corrector (folder_corrector.py)**
- Renames folders using validated file numbers
- Handles conflicts (skip, rename old, overwrite)
- Creates backups of original names in archive
- Logs all changes with timestamps

**4. Database (database.py)**
- SQLite storage for:
  - Configuration settings
  - Correction history (indexed for fast lookups)
  - Watcher session metadata
  - Performance statistics
- Maintains `corrections.jsonl` file for retention > SQLite limits

**5. Web UI (web_ui.py + dashboard.html)**
- **REST API endpoints** for:
  - Starting/stopping watcher
  - Testing file number validation
  - Viewing correction history
  - Updating configuration
  - Real-time status monitoring
- **Dashboard** displays:
  - Active monitoring status
  - Recent corrections with before/after names
  - Error statistics
  - System logs

---

