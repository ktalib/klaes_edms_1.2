Here is the technical hype about **Project KLAES**—the powerhouse behind modern Land Administration.

### 🚀 The KLAES Tech Stack: Enterprise-Grade & Built to Scale

Project KLAES isn't just a web app; it's a **monolithic beast** engineered for high-integrity data management and lightning-fast land transactions.

#### 🏗️ The Backbone: Laravel 9 + PHP 8.1
At its core, KLAES runs on **Laravel 9**, leveraging the most robust features of the PHP ecosystem. It’s built with a **Service-Oriented Architecture** within the monolith, using dedicated handlers like the `PropertyIdAllocationService` to ensure every square inch of land is accounted for with a unique 12-digit **Prop ID**.

#### 🗄️ The Data Engine: SQL Server (Enterprise)
While others play with small-scale databases, KLAES is powered by **Microsoft SQL Server (`sqlsrv`)**. This ensures ACID compliance and enterprise-level reliability for millions of property records. We even keep a legacy MySQL instance on standby for historical read-only access.

#### 🎨 The Frontend: The "TALL" Hybrid
We’ve blended the best of modern reactive UI with battle-tested enterprise components:
*   **Tailwind CSS 3.0**: For a sleek, modern, and ultra-responsive design.
*   **Alpine.js & Livewire**: Real-time interactivity without the overhead of heavy SPA frameworks.
*   **Bootstrap 5 + DataTables.net**: Hardcore data management with high-performance filtering and sorting for thousands of registry files.
*   **Laravel Mix**: Orchestrating the entire asset pipeline with Webpack efficiency.

---

### 🛡️ Hardcore Features & "Hype" Specs

*   **EDMS (Electronic Document Management System)**: A high-velocity workflow including **Blind Scanning**, **Scan Uploads**, and **Page Typing** that digitizes physical land records into searchable, high-fidelity data.
*   **Prop ID Ecosystem**: A 12-digit cross-table unique identifier system that acts as the "Social Security Number" for every property in the state.
*   **Weighted Legal Search**: A sophisticated algorithm that uses **fingerprinting** and **source-based scoring** to resolve transaction conflicts between historical files and modern records. It’s basically "Google Search" but for land titles.
*   **File Normalization Engine**: An advanced regex-powered system that cleans and standardizes messy legacy file numbers (fixing years, prefixes, and serials) in real-time.
*   **Security & Audit**: Powered by **Spatie Permissions**, **Sanctum**, and a custom **AuditService** that logs every single CRUD action for total accountability.
*   **Document Generation**: Integrated with **DomPDF**, **PHPWord**, and **FPDI** to generate high-security Certificates of Occupancy (CofO) and Reports on the fly.

### 📊 Performance Metrics
*   **Zero-Downtime Cache**: Optimized cache clearing strategy (`config:clear` -> `cache:clear`) to keep the system snappy.
*   **Sequential ID Generation**: Custom services to prevent ID collisions in high-concurrency environments.
*   **Lineage Tracking**: Built-in parent-child relationship tracking for property subdivisions and mergers.

**KLAES is where high-end engineering meets the complexity of land law.** It’s fast, it’s secure, and it’s built to be the single source of truth for land administration. ⚡📑🏗️


 

## **Folder Watcher System - Project Overview**

### **What The App Does**

This is a **File Number Correction & Auto-Watcher System** that automatically detects and fixes incorrectly named folders in Windows directories. It's designed for organizations managing thousands of files with strict naming conventions.

**Core Functions:**
1. **Real-time Monitoring** — Watches specified folders 24/7 for new or incorrectly named directories
2. **Auto-Correction** — Automatically renames folders with file number errors to the correct format
3. **Error Detection** — Identifies common mistakes like:
   - OCR errors: `C0M` → `COM` (zero vs letter O)
   - Spelling errors: `RES` vs `RRES`, `CM` vs `COM`
   - Format issues: `RES-2025-1` vs `RES - 2025 - 1` (spaces)
   - Year mismatches: `RES-25-100` → `RES-2025-100` (2-digit to 4-digit years)
4. **Batch Processing** — Correct existing folders in bulk
5. **Audit & Logging** — Full audit trail of all corrections with timestamps
6. **Web Dashboard** — View corrections, validate file numbers, manage configuration via browser UI

---

### **Technical Framework**

| Component | Technology | Purpose |
|-----------|-----------|---------|
| **Language** | Python 3 | Cross-platform, data processing |
| **File Monitoring** | Watchdog library | Real-time file system events |
| **Web API** | Flask + Flask-CORS | REST endpoints for UI |
| **Database** | SQLite | Persistent configuration & correction history |
| **Config** | YAML | Flexible, human-readable settings |
| **Frontend** | HTML/CSS/JavaScript | Dashboard interface |
| **Logging** | Python logging | Structured logs in JSON format |

**Dependencies:**
```
watchdog >= 3.0.0  # Real-time file system monitoring
PyYAML >= 6.0      # YAML config parsing
Flask >= 2.0.0     # Web API framework
Flask-CORS >= 4.0  # Cross-origin requests
```

---

