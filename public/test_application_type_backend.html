<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Validation Test - Application Type</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-900">Backend Validation Test - Application Type</h1>
        
        <!-- Test Results Container -->
        <div id="results" class="space-y-4"></div>
        
        <!-- Test Buttons -->
        <div class="mt-8 space-y-4">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Test Scenarios</h2>
                
                <div class="space-y-3">
                    <button onclick="testPrimaryValidation()" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        1. Test PRIMARY Validation (with application_type)
                    </button>
                    
                    <button onclick="testPrimaryMissingType()" class="w-full px-4 py-3 bg-orange-600 text-white rounded-lg hover:bg-orange-700">
                        2. Test PRIMARY Missing application_type (should fail)
                    </button>
                    
                    <button onclick="testSuAValidation()" class="w-full px-4 py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
                        3. Test SuA Validation (with application_type)
                    </button>
                    
                    <button onclick="testSuAInvalidType()" class="w-full px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        4. Test SuA Invalid application_type (should fail)
                    </button>
                    
                    <button onclick="checkDatabaseColumns()" class="w-full px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                        5. Verify Database Columns Exist
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        const csrfToken = '{{ csrf_token() }}'; // Replace with actual CSRF token in production

        function addResult(title, success, message, details = null) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `p-4 rounded-lg ${success ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`;
            
            let html = `
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 ${success ? 'text-green-400' : 'text-red-400'}" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="${success ? 'M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z' : 'M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 9.586 8.707 7.293z'}" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3 flex-1">
                        <h3 class="text-sm font-medium ${success ? 'text-green-800' : 'text-red-800'}">${title}</h3>
                        <div class="mt-2 text-sm ${success ? 'text-green-700' : 'text-red-700'}">
                            <p>${message}</p>
                        </div>
                        ${details ? `<pre class="mt-2 text-xs ${success ? 'text-green-600' : 'text-red-600'} bg-white p-2 rounded overflow-auto">${JSON.stringify(details, null, 2)}</pre>` : ''}
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }

        async function testPrimaryValidation() {
            try {
                const response = await fetch('/commission-new-st/commission', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({
                        np_fileno: 'ST-COM-2025-TEST1',
                        application_type: 'Direct Allocation', // VALID
                        applicant_type: 'individual',
                        land_use: 'COMMERCIAL',
                        first_name: 'Test',
                        surname: 'User'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addResult('✅ PRIMARY Validation Passed', true, 'Application type "Direct Allocation" accepted', data);
                } else {
                    addResult('❌ PRIMARY Validation Failed', false, data.message || 'Unexpected failure', data);
                }
            } catch (error) {
                addResult('❌ PRIMARY Test Error', false, error.message);
            }
        }

        async function testPrimaryMissingType() {
            try {
                const response = await fetch('/commission-new-st/commission', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({
                        np_fileno: 'ST-COM-2025-TEST2',
                        // MISSING application_type
                        applicant_type: 'individual',
                        land_use: 'COMMERCIAL',
                        first_name: 'Test',
                        surname: 'User'
                    })
                });
                
                const data = await response.json();
                
                if (!data.success && data.errors && data.errors.application_type) {
                    addResult('✅ Validation Works', true, 'Correctly rejected missing application_type', data.errors);
                } else {
                    addResult('❌ Validation Failed', false, 'Should have rejected missing application_type', data);
                }
            } catch (error) {
                addResult('❌ Test Error', false, error.message);
            }
        }

        async function testSuAValidation() {
            try {
                const response = await fetch('/commission-new-st/commission-sua', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({
                        land_use: 'RESIDENTIAL',
                        application_type: 'Conversion', // VALID
                        applicant_type: 'corporate',
                        corporate_name: 'Test Corp',
                        rc_number: 'RC12345'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addResult('✅ SuA Validation Passed', true, 'Application type "Conversion" accepted', data);
                } else {
                    addResult('❌ SuA Validation Failed', false, data.message || 'Unexpected failure', data);
                }
            } catch (error) {
                addResult('❌ SuA Test Error', false, error.message);
            }
        }

        async function testSuAInvalidType() {
            try {
                const response = await fetch('/commission-new-st/commission-sua', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify({
                        land_use: 'RESIDENTIAL',
                        application_type: 'Invalid Type', // INVALID
                        applicant_type: 'individual',
                        first_name: 'Test',
                        surname: 'User'
                    })
                });
                
                const data = await response.json();
                
                if (!data.success && data.errors && data.errors.application_type) {
                    addResult('✅ Validation Works', true, 'Correctly rejected invalid application_type', data.errors);
                } else {
                    addResult('❌ Validation Failed', false, 'Should have rejected invalid application_type', data);
                }
            } catch (error) {
                addResult('❌ Test Error', false, error.message);
            }
        }

        async function checkDatabaseColumns() {
            addResult('ℹ️  Database Check', true, 'Run verify_application_type_column.php in terminal to check database columns');
        }

        // Auto-scroll to top on new result
        resultsDiv.addEventListener('DOMNodeInserted', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
