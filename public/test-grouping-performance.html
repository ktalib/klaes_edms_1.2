<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Analytics Performance Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .test-result { padding: 1rem; margin: 1rem 0; border-radius: 8px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .timing { font-weight: bold; color: #007bff; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Grouping Analytics Performance Test</h1>
    
    <div>
        <button onclick="testDashboard()">Test Dashboard Load</button>
        <button onclick="testDebugEndpoint()">Test Debug Performance</button>
        <button onclick="refreshCache()">Refresh Cache</button>
    </div>

    <div id="results"></div>

    <script>
        async function testDashboard() {
            addResult('Testing dashboard load...', 'info');
            const start = Date.now();
            
            try {
                const response = await fetch('/grouping-analytics/', {
                    method: 'GET',
                    headers: { 'Accept': 'text/html' }
                });
                
                const duration = Date.now() - start;
                
                if (response.ok) {
                    addResult(`✅ Dashboard loaded successfully in ${duration}ms`, 'success');
                } else {
                    addResult(`❌ Dashboard failed with status ${response.status}`, 'error');
                }
            } catch (error) {
                const duration = Date.now() - start;
                addResult(`❌ Dashboard error after ${duration}ms: ${error.message}`, 'error');
            }
        }

        async function testDebugEndpoint() {
            addResult('Testing debug performance...', 'info');
            const start = Date.now();
            
            try {
                const response = await fetch('/grouping-analytics/debug-performance');
                const data = await response.json();
                const duration = Date.now() - start;
                
                if (data.success) {
                    addResult(`✅ Debug completed in ${duration}ms`, 'success');
                    addResult(`Total query time: ${(data.timings.total_duration * 1000).toFixed(2)}ms`, 'info');
                    addResult(`Memory usage: ${(data.memory_usage / 1024 / 1024).toFixed(2)}MB`, 'info');
                } else {
                    addResult(`❌ Debug failed: ${data.error}`, 'error');
                }
            } catch (error) {
                const duration = Date.now() - start;
                addResult(`❌ Debug error after ${duration}ms: ${error.message}`, 'error');
            }
        }

        async function refreshCache() {
            addResult('Refreshing cache...', 'info');
            const start = Date.now();
            
            try {
                const response = await fetch('/grouping-analytics/refresh-cache', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.content || ''
                    }
                });
                
                const data = await response.json();
                const duration = Date.now() - start;
                
                if (data.success) {
                    addResult(`✅ Cache refreshed in ${duration}ms`, 'success');
                } else {
                    addResult(`❌ Cache refresh failed: ${data.error}`, 'error');
                }
            } catch (error) {
                const duration = Date.now() - start;
                addResult(`❌ Cache refresh error after ${duration}ms: ${error.message}`, 'error');
            }
        }

        function addResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<span class="timing">[${new Date().toLocaleTimeString()}]</span> ${message}`;
            results.insertBefore(div, results.firstChild);
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            addResult('Performance test page loaded', 'info');
        });
    </script>
</body>
</html>
