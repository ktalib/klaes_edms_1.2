<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ST Filter API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>ST Filter API Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Regular Files (No ST Filter)</h3>
        <button onclick="testRegularFiles()">Test Regular Files</button>
        <div id="regular-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: ST Files Only</h3>
        <button onclick="testSTFiles()">Test ST Files</button>
        <div id="st-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Direct ST Page Access</h3>
        <a href="/printlabel?url=st" target="_blank">
            <button>Open ST Print Labels Page</button>
        </a>
    </div>

    <script>
        async function testRegularFiles() {
            const resultDiv = document.getElementById('regular-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('/print-label/get-available-files', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h4>✅ Success</h4>
                        <p><strong>Total Files:</strong> ${data.pagination.total}</p>
                        <p><strong>Per Page:</strong> ${data.pagination.per_page}</p>
                        <p><strong>ST Filter:</strong> ${data.st_filter || false}</p>
                        <h5>Sample Files:</h5>
                        <pre>${JSON.stringify(data.data.slice(0, 3), null, 2)}</pre>
                    `;
                } else {
                    throw new Error(data.message || 'Unknown error');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<h4>❌ Error</h4><p>${error.message}</p>`;
            }
        }
        
        async function testSTFiles() {
            const resultDiv = document.getElementById('st-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('/print-label/get-available-files?st_filter=true', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h4>✅ Success</h4>
                        <p><strong>Total ST Files:</strong> ${data.pagination.total}</p>
                        <p><strong>Per Page (Max 20):</strong> ${data.pagination.per_page}</p>
                        <p><strong>ST Filter:</strong> ${data.st_filter}</p>
                        <h5>ST Files Found:</h5>
                        <pre>${JSON.stringify(data.data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(data.message || 'Unknown error');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<h4>❌ Error</h4><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
